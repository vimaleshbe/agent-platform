services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  egress:
    image: ubuntu/squid:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./egress/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - app-network
      - outbound-network

  litellm:
    image: docker.litellm.ai/berriai/litellm-database:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      egress:
        condition: service_started
    command:
      - --config
      - /app/litellm-config.yaml
      - --drop_params
    environment:
      LITELLM_MASTER_KEY: admin123
      AZURE_API_KEY: ${AZURE_API_KEY}
      AZURE_API_BASE: ${AZURE_API_BASE}
      DATABASE_URL: postgresql://litellm:litellm@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,postgres,litellm,ingress,egress
      SERVER_ROOT_PATH: /litellm
    volumes:
      - ./litellm/litellm-config.yaml:/app/litellm-config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.settimeout(2); s.connect((\"127.0.0.1\", 4000)); s.close()'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  ingress:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./ingress/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
      - publish-network

volumes:
  postgres_data:

networks:
  app-network:
    internal: true
  outbound-network:
    driver: bridge
  publish-network:
    driver: bridge



